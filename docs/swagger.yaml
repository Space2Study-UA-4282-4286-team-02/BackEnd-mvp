openapi: 3.0.0
info:
  title: BackEnd-mvp API (offers & messages)
  version: "1.0.0"
  description: API documentation for BackEnd-mvp
servers:
  - url: http://localhost:8080
paths:
  /offers:
    get:
      summary: Get offers
      responses:
        '200':
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Create offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /offers/{id}:
    get:
      summary: Get offer by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Offer object
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Update offer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete offer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /chats/{id}/messages:
    get:
      summary: Get messages for a chat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Send message to a chat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Message created
    delete:
      summary: Delete messages in a chat (clears messages according to request)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Deleted
    patch:
      summary: Clear chat history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Cleared
  /auth/google-auth:
    post:
      summary: Authenticate user with Google token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                role:
                  type: string
              required:
                - token
      responses:
        '200':
          description: Access token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '400':
          description: Invalid Google token
        '401':
          description: User not confirmed or not found
  /auth/confirm-email/{token}:
    get:
      summary: Confirm user email by token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid confirmation token
        '404':
          description: User not found
