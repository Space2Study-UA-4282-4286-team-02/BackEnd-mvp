openapi: 3.0.0

info:
  title: BackEnd-mvp API
  version: "1.0.0"
  description: API documentation for BackEnd-mvp

servers:
  - url: http://localhost:8080

paths:
  /offers:
    get:
      summary: Get offers
      responses:
        '200':
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Create offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created

  /offers/{id}:
    get:
      summary: Get offer by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Offer object
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Update offer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete offer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /chats/{id}/messages:
    get:
      summary: Get messages for a chat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Send message to a chat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Message created
    delete:
      summary: Delete messages in a chat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
    patch:
      summary: Clear chat history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cleared

  /auth/google-auth:
    post:
      tags:
        - Auth
      summary: Sign in with Google
      description: >
        Accepts a Google ID token (JWT) from the client, verifies it using
        google-auth-library OAuth2Client (audience = GOOGLE_CLIENT_ID),
        extracts the token payload (email, sub) and performs authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              description: HttpOnly cookies with access and refresh tokens
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Missing or malformed idToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid Google token or user not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Google account mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/confirm-email/{token}:
    get:
      summary: Confirm user email by token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid confirmation token
        '404':
          description: User not found

  /locations/countries:
    get:
      tags:
        - Locations
      summary: Get list of countries
      description: Returns list of countries from countrystatecity.in
      responses:
        '200':
          description: A JSON array of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Ukraine
                    iso2:
                      type: string
                      example: UA
                    iso3:
                      type: string
                      example: UKR
                    phone_code:
                      type: string
                      description: International phone code for the country (can include '+')
                      example: "+380"
              examples:
                sample:
                  summary: Example countries response
                  value:
                    - name: "Ukraine"
                      iso2: "UA"
                      iso3: "UKR"
                      phone_code: "+380"
                    - name: "United States"
                      iso2: "US"
                      iso3: "USA"
                      phone_code: "+1"

components:
  schemas:
    GoogleAuthRequest:
      type: object
      properties:
        idToken:
          type: string
          description: Google ID token (JWT)
      required:
        - idToken

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
      required:
        - accessToken

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
