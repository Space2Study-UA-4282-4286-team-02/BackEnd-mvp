openapi: 3.0.0
info:
  title: BackEnd-mvp API
  version: "1.0.0"
  description: API documentation for BackEnd-mvp

servers:
  - url: http://localhost:8080

paths:
  /offers:
    get:
      summary: Get offers
      responses:
        '200':
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Create offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created

  /offers/{id}:
    get:
      summary: Get offer by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Offer object
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Update offer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete offer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /lessons:
    get:
      tags:
        - Lessons
      summary: Get lessons
      description: Get lessons for the current user. Accessible to authenticated tutors/admins/superadmins.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: title
          required: false
          schema:
            type: string
        - in: query
          name: categories
          required: false
          schema:
            type: array
            items:
              type: string
        - in: query
          name: sort
          required: false
          schema:
            type: string
            example: '{"order":"asc","orderBy":"updatedAt"}'
        - in: query
          name: skip
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of lessons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonList'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Lessons
      summary: Create lesson
      description: Create a new lesson. Accessible to authenticated users with role Tutor, Admin, or SuperAdmin.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateRequest'
      responses:
        '201':
          description: Lesson created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'

  /quizzes:
    get:
      tags:
        - Quizzes
      summary: Get quizzes
      description: Get quizzes for the current user. Accessible to authenticated tutors/admins/superadmins.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: title
          required: false
          schema:
            type: string
        - in: query
          name: categories
          required: false
          schema:
            type: array
            items:
              type: string
        - in: query
          name: sort
          required: false
          schema:
            type: string
            example: '{"order":"asc","orderBy":"updatedAt"}'
        - in: query
          name: skip
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of quizzes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizList'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (no/invalid auth cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (authenticated but not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quizzes/{id}:
    get:
      tags:
        - Quizzes
      summary: Get quiz by id
      description: Get a quiz by id. Accessible to authenticated tutors/admins/superadmins.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quiz details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (no/invalid auth cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (authenticated but not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Quiz not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Quizzes
      summary: Update quiz
      description: Update an existing quiz. Accessible to authenticated tutors/admins/superadmins.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizUpdateRequest'
      responses:
        '200':
          description: Quiz updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (no/invalid auth cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (authenticated but not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Quiz not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (no/invalid auth cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (authenticated but not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lessons/{id}:
    get:
      tags:
        - Lessons
      summary: Get lesson by id
      description: Get a lesson by id. Accessible to authenticated tutors/admins/superadmins.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lesson details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Lessons
      summary: Update lesson
      description: Update an existing lesson. Accessible to authenticated tutors/admins/superadmins.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdateRequest'
      responses:
        '200':
          description: Lesson updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Lessons
      summary: Delete lesson
      description: Delete a lesson by id. Accessible to authenticated tutors/admins/superadmins.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Lesson deleted successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories:
    get:
      summary: Get categories
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
        - in: query
          name: skip
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        appearance:
                          type: object
                          properties:
                            icon:
                              type: string
                            color:
                              type: string
                        totalOffers:
                          type: object
                          properties:
                            student:
                              type: integer
                            tutor:
                              type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    get:
      summary: Get category by id
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  name:
                    type: string
                  appearance:
                    type: object
                    properties:
                      icon:
                        type: string
                      color:
                        type: string
                  totalOffers:
                    type: object
                    properties:
                      student:
                        type: integer
                      tutor:
                        type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/names:
    get:
      summary: Get category names
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of category names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}/subjects/names:
    get:
      summary: Get subject names by category id
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of subject names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chats/{id}/messages:
    get:
      summary: Get messages for a chat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Send message to a chat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Message created
    delete:
      summary: Delete messages in a chat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
    patch:
      summary: Clear chat history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cleared

  /auth/google-auth:
    post:
      tags:
        - Auth
      summary: Sign in with Google
      description: >
        Accepts a Google ID token (JWT) from the client, verifies it using
        google-auth-library OAuth2Client (audience = GOOGLE_CLIENT_ID),
        extracts the token payload (email, sub) and performs authentication
        via authService.googleLogin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              description: HttpOnly cookies with access and refresh tokens
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Missing or malformed idToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid Google token or user not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Google account mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories:
    post:
      tags:
        - Categories
      summary: Create Category
      description: >
        Create a new category. Accessible only to authenticated users with role **Admin**.
      security:
        - cookieAuth: []        
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            examples:
              minimal:
                value:
                  name: "Utilities"
              full:
                value:
                  name: "Home"
                  appearance:
                    icon: "icons/home.svg"
                    color: "#ff0000"
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Validation error (bad request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (no/invalid auth cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (authenticated but not Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — category with the same unique field already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      name: accessToken

  schemas:
    GoogleAuthRequest:
      type: object
      properties:
        idToken:
          type: string
          description: Google ID token (JWT)
      required:
        - idToken

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
      required:
        - accessToken

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    Appearance:
      type: object
      required:
        - icon
        - color
      properties:
        icon:
          type: string
          example: "mocked-path-to-icon"
        color:
          type: string
          example: "#66C42C"

    Category:
      type: object
      required:
        - name
        - appearance
      properties:
        _id:
          type: string
          example: "64b1c4f4e3a2b1c0d1e2f3a"
        name:
          type: string
          example: "Programming"
        appearance:
          $ref: '#/components/schemas/Appearance'
 
        totalOffers:
          type: object
          properties:
            student:
              type: integer
              example: 0
            tutor:
              type: integer
              example: 0

        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Unique category name (1..255 chars)
          minLength: 1
          maxLength: 255
          example: "Programming"
        appearance:
          $ref: '#/components/schemas/Appearance'

    LessonCreateRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: "Intro to Algebra"
        description:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Learn the basics of algebraic expressions."
        content:
          type: string
          example: "<p>Lesson content</p>"
        attachments:
          type: array
          items:
            type: string
          example: []
        category:
          type: string
          nullable: true
          example: "64b1c4f4e3a2b1c0d1e2f3a"

    LessonUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        content:
          type: string
        attachments:
          type: array
          items:
            type: string
        category:
          type: string
          nullable: true

    Lesson:
      type: object
      required:
        - _id
        - title
        - description
        - author
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          example: "64b1c4f4e3a2b1c0d1e2f3b"
        title:
          type: string
          example: "Intro to Algebra"
        description:
          type: string
          example: "Learn the basics of algebraic expressions."
        content:
          type: string
          example: "<p>Lesson content</p>"
        attachments:
          type: array
          items:
            type: string
          example: []
        category:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            name:
              type: string
        author:
          type: string
          example: "64b1c4f4e3a2b1c0d1e2f3c"
        resourceType:
          type: string
          example: "lessons"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LessonList:
      type: object
      properties:
        count:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'

    Quiz:
      type: object
      required:
        - _id
        - title
        - description
        - author
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          example: "64b1c4f4e3a2b1c0d1e2f3d"
        title:
          type: string
          example: "Intro to Algebra Quiz"
        description:
          type: string
          example: "Check your understanding of algebraic expressions."
        items:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        category:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            name:
              type: string
        author:
          type: string
          example: "64b1c4f4e3a2b1c0d1e2f3c"
        quizView:
          type: string
          example: "Scroll"
        shuffleQuestions:
          type: boolean
          example: false
        pointValues:
          type: boolean
          example: false
        scoredUnscoredResponses:
          type: boolean
          example: false
        correctAnswers:
          type: boolean
          example: false
        resourceType:
          type: string
          example: "quizzes"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    QuizUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: "Updated quiz title"
        description:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Updated quiz description."
        items:
          type: array
          items:
            type: string
          example: []
        category:
          type: string
          nullable: true
          example: "64b1c4f4e3a2b1c0d1e2f3a"
        quizView:
          type: string
          enum: ["Stepper", "Scroll"]
        shuffleQuestions:
          type: boolean
        pointValues:
          type: boolean
        scoredUnscoredResponses:
          type: boolean
        correctAnswers:
          type: boolean

    Question:
      type: object
      required:
        - _id
        - title
        - text
        - type
        - author
      properties:
        _id:
          type: string
          example: "64b1c4f4e3a2b1c0d1e2f3e"
        title:
          type: string
          example: "Linear equations basics"
        text:
          type: string
          example: "Solve: 2x + 3 = 11"
        answers:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              isCorrect:
                type: boolean
        type:
          type: string
          example: "oneAnswer"
        category:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            name:
              type: string
        author:
          type: string
          example: "64b1c4f4e3a2b1c0d1e2f3c"
        resourceType:
          type: string
          example: "questions"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    QuizList:
      type: object
      properties:
        count:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/Quiz'
